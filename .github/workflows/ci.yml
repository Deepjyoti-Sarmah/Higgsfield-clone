name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/higgsfield
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: higgsfield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv --directory apps/api sync

      - name: Migrate database
        run: uv --directory apps/api run alembic upgrade head

      - name: Lint
        run: uv --directory apps/api run ruff check .

      - name: Typecheck
        run: uv --directory apps/api run mypy

      - name: Test
        run: uv --directory apps/api run pytest -q

      - name: Check contract is in sync
        run: |
          scripts/export-openapi
          git diff --exit-code packages/contracts/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API client
        run: npm run gen:api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check standards
        run: scripts/check-standards

      - name: Check links
        run: scripts/check-links

      - name: Build image
        run: docker build -t hf-clone .

      - name: Check ffmpeg in image
        run: |
          docker run --rm --entrypoint ffmpeg hf-clone -version
          docker run --rm --entrypoint ffprobe hf-clone -version
